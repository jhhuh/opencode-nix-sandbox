name: Update flake inputs

on:
  schedule:
    - cron: '0 3 * * *' # daily at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            accept-flake-config = true

      # opencode comes from llm-agents.nix; resolve its version at the
      # llm-agents rev currently pinned in flake.lock.
      - name: opencode version (before)
        id: before
        run: |
          rev=$(jq -r '.nodes.llm-agents.locked.rev' flake.lock)
          echo "version=$(nix eval --raw "github:numtide/llm-agents.nix/$rev#packages.x86_64-linux.opencode.version")" >> "$GITHUB_OUTPUT"

      - name: Update flake inputs
        run: nix flake update

      - name: opencode version (after)
        id: after
        run: |
          rev=$(jq -r '.nodes.llm-agents.locked.rev' flake.lock)
          echo "version=$(nix eval --raw "github:numtide/llm-agents.nix/$rev#packages.x86_64-linux.opencode.version")" >> "$GITHUB_OUTPUT"

      # Only proceed when the opencode version actually changed; otherwise the
      # nixpkgs bump is noise and the updated flake.lock is discarded with the runner.
      - name: Build default package
        if: steps.before.outputs.version != steps.after.outputs.version
        run: nix build

      - name: Commit and push
        if: steps.before.outputs.version != steps.after.outputs.version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "chore: update flake inputs (opencode ${{ steps.before.outputs.version }} -> ${{ steps.after.outputs.version }})"
          git push
